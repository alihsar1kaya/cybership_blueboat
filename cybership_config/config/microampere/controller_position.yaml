/**:
  ros__parameters:
    # Microampere: gains copied from voyager. Mass/added mass come from microampere/vessel.yaml
    # (vessel_model parameter set by vessel.launch.py), so vessel.* below is unused there.
    vessel:
      length: 1.0    # Length of vessel (m)
      beam: 0.3      # Width of vessel (m)
      draft: 0.02    # Draft/depth of vessel (m)

    # Controller parameters
    control:
      # Model-based DP law (Fossen): gains computed per DOF from M and D in microampere/vessel.yaml,
      #   Kp = M*omega_n^2,  Kd = 2*zeta*M*omega_n - D,  Ki = ki_ratio*omega_n*Kp
      # so surge, sway and yaw get the same closed-loop behaviour although sway is ~5x heavier.
      # The fixed p_gain/i_gain/d_gain below are then NOT used.
      model_based: true
      # [rad/s] surge, sway, yaw (yaw 1.0: follows the faster turn reference). Sway 0.3 gave Kp 15 N/m against
      # 171 N s/m of sway damping: an overdamped loop with an 11 s time constant, so the last 0.4 m sideways
      # took 25 s. 0.45 / 0.6 (11.11 sweep): mean time to settle 3-4 s shorter in calm, current and wind.
      omega_n: [0.45, 0.6, 1.0]
      zeta: [0.9, 0.9, 0.9]
      ki_ratio: 0.1
      # Anti-windup limit on the integral force. The integral must be able to cancel slowly varying
      # forces (ocean current, wave drift; Fossen L7/L8), so allow up to what the thrusters can give.
      max_integral_force: [100.0, 60.0, 30.0]   # [N, N, Nm]
      # Position control gains
      p_gain:
        pos: 1.6     # Proportional gain for position
        vel: 0.7     # Proportional gain for velocity
        yaw: 1.1     # Proportional gain for yaw

      # Integral gains
      i_gain:
        pos: 0.2     # Integral gain for position
        vel: 0.1     # Integral gain for velocity
        yaw: 0.2     # Integral gain for yaw

      # Derivative gains
      d_gain:
        pos: 0.5     # Derivative gain for position
        vel: 0.5     # Derivative gain for velocity
        yaw: 0.5     # Derivative gain for yaw

      # Integral error limits
      # Raised from voyager (1.0 / 0.3): the integral term must be able to exceed Microampere's
      # 0.5 N thruster deadband, otherwise the boat stops short of the goal.
      max_integral_error:
        pos: 5.0     # Maximum position error integration (Ki*5 = 1 N)
        yaw: 1.5     # Maximum yaw error integration

      # Saturation parameters
      saturation:
        pos: 0.1     # Position control saturation
        yaw: 0.1     # Yaw control saturation

      # Target reaching tolerances
      tolerance:
        pos: 0.25    # Position reaching tolerance (m)
        yaw: 0.1     # Yaw angle reaching tolerance (rad)

    # Guidance "turn then go": far from the goal, turn the bow towards it, then drive bow first
    # (the stern thrusters are made for that); DP with the goal heading only near the goal.
    guidance:
      turn_then_go: true
      # [m] goals closer than this: plain DP (small corrections, crab with the azimuth); farther goals:
      # turn the bow to the goal and drive. 5 m made the boat crab sideways for normal moves.
      min_transit_distance: 1.5
      # [m] in transit, switch to station keeping (and turn to the final heading) this close. Must be
      # small: with 5 m the boat turned 140 deg while still at transit speed and drifted 1 m past.
      approach_radius: 1.5
      # [m] then 'arrive' (stop with the transit heading) and turn to the final heading only this close
      settle_radius: 0.3
      # [deg/s] then turn to the final heading at this rate (a 144 deg turn in 4 s pushed it 0.5 m away)
      final_turn_rate_deg_s: 15.0
      # Manoeuvre choice per goal (forward / reverse / dp) by estimated time:
      #   T    = (turn to the course + turn to the final heading) / turn rate + distance / speed
      #   T_dp = distance / speed in that body direction + turn to the final heading / final turn rate
      # e.g. 3 m straight behind, same heading: reverse ~9 s vs forward ~35 s (turn 180 there and back);
      # 3 m straight to the side: dp 15 s vs forward 20 s (measured 31 s vs 45 s to settle within 5 cm)
      forward_speed: 0.6         # [m/s] bow first
      reverse_speed: 0.35        # [m/s] stern first: 80 % reverse thrust, blunt transom
      turn_rate_deg_s: 20.0      # [deg/s] incl. accelerating (180 deg in ~9 s measured)
      # The reference moves no faster than these speeds (forward_speed, reverse_speed, sway_speed as an
      # ellipse in the body frame), through the water when the observer estimates the current. Without
      # the limit the reference filter's speed grows with the distance: 4 m sideways asked for more sway
      # force than the bow azimuth has (0.2 m/s sideways takes about 45 of its 67 N).
      sway_speed: 0.2            # [m/s] 0 = no speed limit
      min_speed: 0.05            # [m/s] over ground when the current alone uses up the limit
      max_turn_rate_deg_s: 25.0  # [deg/s] heading reference; a 180 deg step gave 35 deg/s and 1 m of drift
      max_dp_distance: 3.5       # [m] moving directly is an option up to here (short repositioning)
      reverse_penalty: 1.0       # >1: backing up must be this much quicker than the alternatives
      # Time estimates [s] for the manoeuvre choice, T = c . [1, features] (see _choose_manoeuvre), fitted
      # (non-negative least squares) to every manoeuvre run to 42 random goals in the offline closed loop.
      # The hand-made estimates chose a slower manoeuvre for 9 of 42 goals (mean 1.4 s, worst 13 s lost);
      # these for 1 of 42 (0.1 s). A final turn on the spot costs ~7 s/rad, twice the old guess.
      time_model:
        path: [12.8, 1.68, 7.16]            # [1, path length m, final turn rad]
        pivot: [12.55, 2.03, 6.78, 4.36]    # [1, path length m, final turn rad, first turn rad]
        reverse: [19.01, 2.52, 3.79]        # [1, distance m, turns rad]
        dp: [15.66, 0.67, 2.27]             # [1, distance / speed limit s, turn rad]
      max_reverse_distance: 6.0  # [m] back up only short distances
      align_angle_deg: 20.0     # [deg]
      # Transit = path following along the line start -> goal (Fossen Ch. 12.5, TTK4190 L6 slides 59-61):
      # ALOS heading autopilot + surge speed control, no sway force. ALOS estimates the crab angle from
      # currents so the boat stays on the line (plain LOS leaves Delta*tan(beta_c) off the line).
      # Off: test 10 m north in 0.15 m/s cross current (tools/run_goal_motion_test.sh, 29.10):
      #   DP transit (false): max cross-track 0.14 m, at goal in 30 s
      #   ALOS (true):        max 0.61 m (crab estimate 8.6 of ~14 deg on a short leg), at goal in 34 s, and
      #   the boat slid 2.4 m back after arriving (observer bias learned during crabbing, then fed forward).
      # ALOS is Fossen's law for underactuated craft (Otter); a fully actuated boat on short legs does better
      # with DP (L6 slide 9). Kept for long transits / waypoints.
      # Dubins paths (11.11): forward moves follow the shortest path with turning radius dubins_radius
      # to the goal pose (or to a nearby arrival heading plus a small turn at the goal, if quicker), with
      # the ALOS law above plus a crab angle fed forward from the observer's current estimate; DP takes
      # over settle_radius before the end. The boat turns while it moves instead of turning on the spot,
      # driving straight and turning on the spot again. Offline sweep, 14 goals (scratchpad harness):
      #   mean time to settle  calm 32.0 -> 29.0 s, 0.15 m/s cross current 37.0 -> 31.7 s, 8 m/s wind 33.1 -> 29.9 s
      #   turning on the spot  ~90 s -> ~30 s in total, thrust energy in current -30 %
      # Off (dubins_radius 0): turn - drive straight (DP transit, or ALOS with path_following) - turn.
      path_following: true
      # [m] 0.6 m/s on a 2 m arc is 17 deg/s. Sweep (calm / 0.15 m/s current): R 1.0 drifts 2 m off the path
      # in current (one timeout), 1.5 and 2.0 are equally quick, 2.5 is slower. With 2.0 a goal behind the boat
      # is reached by turning towards it on the spot first and then the path (path 18 % shorter than U-turn loops)
      dubins_radius: 2.0
      # los, alos or ilos (ilos_kappa): with the crab angle fed forward from the current estimate they are
      # within 1 s of each other; ilos with kappa 1.0 was worse (3 s slower, 2.2 m off the path in current)
      los_method: alos
      ilos_kappa: 0.2
      # Final approach: the Dubins path ends approach_length before the goal and a straight leg on the goal
      # heading follows. With approach_dp, DP tracks a point sliding along that leg and braking evenly to
      # rest at the goal (speed and deceleration fed forward), so the azimuth fixes the sideways error on
      # the way in. Without it the path ended in a turn and DP crept the last 0.3-0.5 m sideways.
      # Sweep: overshoot in current 0.81 -> 0.28 m, straight 4 m goal 21 -> 14 s.
      approach_length: 1.5      # [m]
      approach_dp: true
      path_end_speed: 0.45      # [m/s] speed where DP takes over (start of the approach leg)
      los_lookahead: 2.5        # [m] Delta; Otter (2 m) uses 10 m on 100 m legs, our legs are 2-20 m
      alos_gamma: 0.02          # [rad/(m s)] ~critically damped cross-track at 0.6 m/s with Delta 2.5
      alos_max_crab_deg: 30.0
      transit_accel: 0.1        # [m/s^2] speed ramp
      arrive_speed: 0.2         # [m/s] at approach_radius, then DP stops the boat

    # Reference filter parameters
    filter:
      # position 0.4: the speed limits in guidance bound the demand now, so the filter only rounds the
      # corners (0.25 without limits; with the limits 0.25 lags 12 s behind and 0.5 starts to overshoot)
      omega: [0.40, 0.40, 0.80]  # [rad/s] yaw 0.8: peak ~36 deg/s for a step, model max ~43
      delta: [1.00, 1.00, 1.00]     # Damping ratio for reference filter

    # Performance metrics configuration
    metrics:
      window_size: 200    # Number of samples in moving window
      interval: 1.0       # Time between metrics calculations (seconds)

    # General parameters
    dt: 0.1              # Control loop time step (seconds)
