# Microampere: NTNU's customized BlueBoat (catamaran).
# 2 fixed thrusters at the stern (one under each hull) + 1 azimuth at the bow on the centerline.
#
# !!! Numbers are from the stock BlueBoat datasheet (bluerobotics.com, read 2026-10-20) or estimates.
# Microampere is modified (extra bow azimuth, electronics), so replace them with measurements when available.
# Datasheet: 120 x 93 x 46 cm (L x W x H, deployed), 14.5 kg without batteries, 2 batteries 2.4 kg,
# freeboard 160 mm (2 batteries), max static thrust 8.2 kgf (both motors), max speed 3 m/s.
# From the Microampere team (2026-10-20): total mass 30.2 kg with 2 batteries per hull (26.8 kg without),
# all three thrusters max 67 N at 400 W, bow azimuth rotates freely 360 deg at 4 s per turn.
# Still missing: CG, exact thruster positions, thrust curves (and reverse thrust).
#
# Frames: body frame NED (x forward, y starboard, z down), origin at CO on the waterline.
# Positions must match cybership_description/urdf/model/microampere/base.urdf.xacro.

name: microampere

# Hull: used for the shoeboxpy box (roll/pitch restoring). Mass, inertia, added mass and
# damping come from the 'model' section below instead of from the box.
hull:
  length: 1.195      # [m] hull length (Blue Robotics hull CAD, BR-101652)
  beam: 0.93         # [m] overall width over both hulls, deployed (datasheet)
  # [m] waterline 274 mm above keel at 30.2 kg, freeboard 102 mm (hull CAD). The Microampere team measured
  # ~300 mm, which the CAD hull gives at 36.3 kg: unclear whether measured to the keel or to the thrusters.
  draft: 0.274
  # GM from Capytaine hydrostatics on the hull CAD for a CG ON THE WATERLINE (tools/capytaine_from_stl.py).
  # The model lowers them by the CG height above the waterline (model.cg).
  GM_phi: 1.07       # [m]
  GM_theta: 0.535    # [m]

# Rigid-body + hydrodynamic model, diagonal, about CO. Order: surge, sway, heave, roll, pitch, yaw.
# Read by both the simulator and the DP controller (cybership_utilities/vessel_model.py).
model:
  # [kg] Microampere as she runs, with 4 batteries (2 per hull), from the Microampere team.
  mass: 30.2
  # [kg m^2] Fossen's radii of gyration, as in the Otter USV model (MSS / PythonVehicleSimulator):
  #   I = m*R^2 with R44 = 0.4*B, R55 = R66 = 0.25*L   (L = 1.2 m, B = 0.93 m)
  # Alternative estimate with all mass in the hulls (y0 = 0.365 m) gives Iz ~ 7.7, so Iz is uncertain
  # by a factor ~3 until it is measured (bifilar pendulum).
  inertia: [4.18, 2.72, 2.72]   # about the CG
  # [m] CG from CO (waterline, midships, centerline) in BODY axes, z down. ESTIMATE, MEASURE IT
  # (hang/tilt test, or weigh each part with its position). Batteries and thrusters sit low in the
  # hulls, the electronics box, frame and azimuth mount above the deck -> CG near the waterline,
  # taken 5 cm above it; x and y on the centre (thrusters aft balance the azimuth forward).
  # Fossen's Otter: r_bG = [0.2, 0, -0.2] m (2 m long, with payload on deck).
  # M_RB = H(r_g)' diag(m I, I_g) H(r_g) (MSS rbody.m); GM_phi/GM_theta drop by 0.05 m.
  cg: [0.0, 0.0, -0.05]
  # Added mass M_A (full 6x6, about CO) by Fossen's power-based averaging (Fossen 2025; MSS
  # computeManeuveringModel.m; L3a/L3b) of the frequency-dependent A(w) from Capytaine on the Blue
  # Robotics hull CAD (BR-101652, hull centres at +-0.374 m with the vertical sides facing inward,
  # 570 mm apart, as in drawing BR-101447), 1794 panels + lid, 0-12 rad/s:
  #   python3 cybership_config/tools/capytaine_hydro.py ~/ros_ws/cad/hull/PUB-BR-101381-001.STL \
  #       --mass 30.2 --hull-offset 0.374 --swap-sides --omega-max 12 --n-omega 48 \
  #       --out cybership_config/config/microampere/hydro_capytaine.npz
  # Plot: python3 ~/ros_ws/tools/plot_hydro.py <npz>  (results/hydro_microampere.png).
  hydro:
    file: hydro_capytaine.npz
    # [rad/s] PM weighting spectrum (spectral peak 0.88 w_p = 2.2 rad/s, T_p ~ 2.9 s): fetch-limited
    # wind sea in sheltered water (JONSWAP peak 2.2-3.2 rad/s for U10 6-10 m/s over 5-10 km fetch).
    # Surge/sway/yaw change < 10 % for w_p = 0.8-3 (A(0) is fine for DP, as Fossen says); heave and
    # the couplings depend on w_p. Gap resonance between the hulls at ~7.8 rad/s (potential theory
    # overpredicts it) changes A_eq < 1 % for w_p <= 3.
    wave_peak_frequency: 2.5
    # [rad/s] leave out the gap resonance between the hulls (~7.8 rad/s): potential theory has no
    # viscosity and overpredicts it (B22 up to 8000 N s/m); with it, half of B_eq,22 came from it.
    max_frequency: 6.5
  # Diagonal fallback (and the old value, A(0) from capytaine_from_stl.py), used without 'hydro':
  added_mass: [2.53, 129.80, 35.68, 2.73, 0.90, 6.41]
  # [N/m] heave restoring rho*g*A_wp, A_wp = 0.263 m^2 (two hulls), Capytaine on the hull CAD.
  heave_stiffness: 2581
  # Damping, Fossen's method as in his Otter USV model (also a catamaran), see
  # cybership_utilities/vessel_model.py. ALL to be identified on the real boat (speed/step tests).
  damping:
    # Surge as Fossen calibrates his Otter USV on experiments (MSS otter.m, 2026-10-14):
    #   X = -(X_u e^(-3|u|) u + X_|u|u |u| u),  X_u = M11 / T_surge,  X_|u|u = max_thrust / max_speed^2
    # The linear term gives the DP (low-speed) response and fades out with speed, the quadratic term
    # the top speed, so the two are not counted twice (L3b p. 26, 30).
    surge_time_constant: 5.0   # [s] Otter value (experiments). MEASURE: step in thrust at low speed
    # Top speed with the two stern thrusters (134 N). Estimate: ITTC-57 friction on the CAD wetted
    # area plus wave/form resistance calibrated on the BlueBoat datasheet (~9 N at 1 m/s, 80 N at
    # 3 m/s for 16.9 kg), scaled to 30.2 kg -> X_|u|u = 13.5. MEASURE: top speed, stern thrusters only.
    max_speed: 3.15            # [m/s]
    max_thrust: 134.0          # [N] 2 x 67 N
    surge_linear_decay: 3.0    # [s/m] Otter value
    sway_time_constant: 1.0    # [s] Y_v = M22 / T_sway   (Otter value)
    yaw_time_constant: 1.0     # [s] N_r = M66 / T_yaw    (Otter value)
    yaw_quadratic_factor: 10.0 # N_|r|r = 10 N_r          (Otter value)
    # Amplitude-dependent roll damping K = D44 (1 + kappa |p|) p (L3b p. 30, Ex6). Sources differ:
    # Ex6 slide 0.1-0.2, Fossen's farSpica_v4.m 3 ("typically 1 to 10"), Otter none. 1.0 gives +50 %
    # at p = 0.5 rad/s (5 deg roll at the 1 s period). IDENTIFY from a roll decay test (zeta and kappa).
    roll_quadratic_factor: 1.0
    # Heave, roll, pitch: total relative damping (Otter values).
    # D = B_eq + Bv (Fossen's computeManeuveringModel): the time constants and zeta are TOTALS, the
    # viscous Bv fills up what the potential damping B_eq lacks. (MSS adds delta_zeta [0, 0.1, 0] on
    # top of B_eq instead, made for ships whose heave/roll/pitch resonances lie inside the wave
    # spectrum. Microampere's lie at 6-7 rad/s, above it, so B_eq gives zeta 0.05/0.01/0.003 only and
    # pitch would be undamped.)
    zeta: [0.3, 0.2, 0.4]
    # Cross-flow drag on ONE hull (as Fossen does for the Otter's pontoons): waterline length and
    # beam of one hull at 274 mm draft (hull CAD), Cd from Hoerner's curve (B/2T = 0.29 -> 1.92).
    cross_flow: {length: 1.056, beam: 0.161, draft: 0.274}
  # Stability at speed. The large sway/heave added mass (Capytaine) gives large destabilising Munk
  # moments; the real boat is held straight by lift on the keels/skegs, which the model lacks.
  # As Fossen does in his Otter USV model: cancel them, and let the thrusters give only X, Y, N
  # (the thrust line is ~10-18 cm below the waterline, roughly where the hull resistance acts).
  cancel_munk: [roll, pitch, yaw]
  thruster_roll_pitch_moments: false

allocation:
  # Fossen 11.2.3: min f'Wf + s'Qs  s.t.  T(alpha) f = tau + s,  -0.8*67 <= F2,F3 <= 67,  0 <= F1 <= 67
  # (cybership_dp/constrained_allocation.py). W = thruster 'weight' (effort), Q = slack weights per
  # DOF [X, Y, N]: Q >> W, highest for yaw so heading is kept and sway is given up first.
  method: constrained_qp
  dofs: [X, Y, N]
  slack_weights: [1.0e4, 1.0e4, 1.0e5]

thrusters:
  - name: port
    type: fixed
    frame: stern_port_thruster_link
    # [m] Drawing BR-101447: propeller just outboard of the vertical inner hull side (y ~ 0.296 m),
    # 123 mm below the waterline with 2 batteries -> ~177 mm at Microampere's 30.2 kg. x is an estimate.
    position: [-0.55, -0.29, 0.177]   # y from the Microampere team sketch (F2)
    direction_deg: 0.0               # pushes forward
    max_force: 67.0                  # [N] at 400 W (Microampere team)
    reverse_ratio: 0.8               # reverse thrust = 80 % of forward (typical T200-type propeller)
    time_constant: 0.1               # [s] thrust build-up (Fossen's Otter: propeller T_n = 0.1 s)
    deadband: 0.5
    allocation:
      weight: 1.0

  - name: starboard
    type: fixed
    frame: stern_starboard_thruster_link
    position: [-0.55, 0.29, 0.177]    # y from the Microampere team sketch (F3)
    direction_deg: 0.0
    max_force: 67.0
    reverse_ratio: 0.8
    time_constant: 0.1
    deadband: 0.5
    allocation:
      weight: 1.0

  - name: bow_azimuth
    type: azimuth                    # rotates freely, no angle limit (Microampere team)
    frame: bow_azimuth_thruster_link
    position: [0.37, 0.0, 0.248]     # [m] Microampere team sketch (F1): 370 mm ahead of CO, 248 mm deep
    max_force: 67.0                  # [N] at 400 W (Microampere team)
    max_rate_deg_s: 90.0             # 4 s per 360 deg (Microampere team)
    time_constant: 0.1               # [s] thrust build-up (Fossen's Otter: propeller T_n = 0.1 s)
    deadband: 0.5
    allocation:
      weight: 1.0
      bias_force: [0.0, 0.0]
